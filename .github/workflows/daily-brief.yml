name: SEO Morning Brief

on:
  schedule:
    - cron: "0 6 * * 1-5"
      timezone: America/Denver
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run morning brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m src.main

      - name: Commit brain updates
        run: |
          git config user.name "seo-brief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/brain.json brain/LEARNINGS.md
          git diff --staged --quiet || git commit -m "Update SEO brain [automated]"
          git push
